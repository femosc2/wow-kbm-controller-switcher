name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build wowswitch.exe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build (Windows amd64)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -o wowswitch.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wowswitch-windows-amd64
          path: wowswitch.exe
          if-no-files-found: error
